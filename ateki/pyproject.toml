[project]
name = "ateki"
version = "0.1.0"
description = "ATEKi: Asymmetric Triage Ensemble Knowledge Inference -- non-egalitarian attribution of agents, policies, and data across group topologies."
requires-python = ">=3.11"
authors = [
    { name = "Kinston Ackolf", email = "kinston.ackolf.wong@utah.edu" }
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analysis*"]

[tool.black]
line-length = 100
target-version = ['py311']
